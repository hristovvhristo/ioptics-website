<script>
(function(){
var CAL='https://calendar.app.google/NS3qrNB96xKo7z7Z8', PHONE='+359883330599';
var app=document.getElementById('app');
var S={mode:null,age:null,pxmm:null,calibrated:false,dist:1000,steps:[],k:0,r:{}};
function store(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function load(k){try{return localStorage.getItem(k)}catch(e){return null}}
var saved=parseFloat(load('io_pxmm')); if(saved>1&&saved<20){S.pxmm=saved;S.calibrated=true}
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function h(html){app.innerHTML=html;window.scrollTo(0,0);var f=app.querySelector('h1,h2');if(f){f.setAttribute('tabindex','-1');f.focus({preventScroll:true})}}
function on(id,fn){var e=document.getElementById(id);if(e)e.addEventListener('click',fn)}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function prog(){var n=S.steps.length,i=Math.min(S.k+1,n);return '<div class="progress"><span>Стъпка '+i+' от '+n+'</span><div class="bar" aria-hidden="true"><span style="width:'+Math.round(i/n*100)+'%"></span></div></div>'}
function next(){S.k++;run()}
var EYE={R:'дясното',L:'лявото',B:'двете'};
function eyeBox(e){
  var cover=e==='R'?'лявото':'дясното';
  var txt=e==='B'?'Гледайте с двете очи. Ако носите очила за далече, сложете ги.':'Покрийте <b>'+cover+' око</b> с длан, без да го натискате. Гледате само с <b>'+EYE[e]+' око</b>.';
  return '<div class="eye"><svg width="44" height="28" viewBox="0 0 44 28" aria-hidden="true"><ellipse cx="11" cy="14" rx="9" ry="7" fill="'+(e==='R'||e==='B'?'#FFFFFF':'#10233A')+'" stroke="#10233A" stroke-width="2"/><circle cx="11" cy="14" r="3" fill="'+(e==='R'||e==='B'?'#2F45D8':'#10233A')+'"/><ellipse cx="33" cy="14" rx="9" ry="7" fill="'+(e==='L'||e==='B'?'#FFFFFF':'#10233A')+'" stroke="#10233A" stroke-width="2"/><circle cx="33" cy="14" r="3" fill="'+(e==='L'||e==='B'?'#2F45D8':'#10233A')+'"/></svg><p>'+txt+'</p></div>';
}

/* ---------- START ---------- */
function start(){
  h('<p class="eyebrow">Безплатен онлайн тест</p><h1>Проверете зрението си за няколко минути</h1>'+
  '<p class="lead">Изберете вида тест. Ще ви трябват монитор или телефон, около 1 метър свободно място и банкова карта или монета от 1 € за калибриране на екрана.</p>'+
  '<div class="modes" role="group" aria-label="Вид тест">'+
  '<button class="choice" id="m-quick" type="button"><b>Бърз тест</b><small>Зрителна острота – всяко око поотделно.</small><span class="t">около 2 минути</span></button>'+
  '<button class="choice" id="m-full" type="button"><b>Пълен тест</b><small>Острота, контраст, астигматизъм, цветове, четене отблизо и решетка на Амслер.</small><span class="t">около 7 минути</span></button>'+
  '</div><p class="note" style="margin-top:14px">Искате само да отговорите на въпроси? <a href="vaprosnik.html">Въпросник за 2 минути</a></p>');
  on('m-quick',function(){S.mode='quick';S.r={};setup()});
  on('m-full',function(){S.mode='full';S.r={};setup()});
}
function setup(){
  var st=['age','calib','dist','va:R','va:L'];
  if(S.mode==='full') st=st.concat(['cs','ast:R','ast:L','col','near','ams:R','ams:L']);
  if(S.mode==='quick') st.shift();
  S.steps=st;S.k=0;run();
}
function run(){
  if(S.k>=S.steps.length) return results();
  var s=S.steps[S.k].split(':');
  ({age:age,calib:calib,dist:dist,va:va,cs:cs,ast:ast,col:col,near:near,ams:ams})[s[0]](s[1]);
}

/* ---------- AGE ---------- */
function age(){
  var o=[['u40','Под 40 години'],['a40','40 – 54 години'],['a55','55 и повече']];
  h(prog()+'<h2>На колко години сте?</h2><p class="hint">Възрастта помага да тълкуваме резултата за четене отблизо.</p><div class="list">'+
  o.map(function(x){return '<button class="choice" type="button" data-v="'+x[0]+'"><b style="font-size:17px">'+x[1]+'</b></button>'}).join('')+'</div>');
  app.querySelectorAll('[data-v]').forEach(function(b){b.addEventListener('click',function(){S.age=b.dataset.v;next()})});
}

/* ---------- CALIBRATION ---------- */
function calib(){
  var mob=/Mobi|Android|iPhone/i.test(navigator.userAgent);
  var px=S.pxmm||(mob?6.1:3.78), obj='card';
  h(prog()+'<h2>Калибриране на екрана</h2><p class="hint">Изберете предмет, допрете го до екрана и нагласете размера с плъзгача или с бутоните − и +, докато фигурата съвпадне точно с него.</p>'+
  '<div class="row" role="group" aria-label="Предмет" style="margin-bottom:14px"><button class="choice" id="o-card" type="button" style="width:auto;padding:10px 16px" aria-pressed="true"><b style="font-size:16px;margin:0">Банкова карта</b></button><button class="choice" id="o-coin" type="button" style="width:auto;padding:10px 16px" aria-pressed="false"><b style="font-size:16px;margin:0">Монета 1 €</b></button></div>'+
  '<p class="note" id="otip"></p><div id="cbw" style="display:grid;place-items:center;min-height:120px;margin:8px 0"><div class="cardbox" id="cb" style="margin:0"><span></span></div></div>'+
  '<div class="row" style="flex-wrap:nowrap;gap:10px"><button class="btn" id="mn" type="button" aria-label="По-малко" style="padding:0;width:52px;flex:none">−</button><input id="sl" type="range" min="2.5" max="11" step="0.01" value="'+px.toFixed(2)+'" aria-label="Размер"><button class="btn" id="pl" type="button" aria-label="По-голямо" style="padding:0;width:52px;flex:none">+</button></div>'+
  '<div class="row" style="margin-top:18px"><button class="btn primary" id="ok" type="button">Готово, съвпада</button><button class="btn" id="skip" type="button">Пропусни</button></div>'+
  '<p class="note" style="margin-top:12px">Без калибриране резултатът е по-неточен.</p>');
  var cb=document.getElementById('cb'),sl=document.getElementById('sl'),tip=document.getElementById('otip'),wrap=document.getElementById('cbw');
  function upd(){
    px=+sl.value; var avail=wrap.clientWidth-4;
    if(obj==='coin'){var d=23.25*px;cb.style.width=d+'px';cb.style.height=d+'px';cb.style.borderRadius='50%';cb.firstChild.style.display='none';tip.textContent='Сложете монета от 1 € върху кръга.'}
    else{cb.style.borderRadius=(3.2*px)+'px';cb.firstChild.style.display='';
      if(85.6*px<=avail){cb.style.width=85.6*px+'px';cb.style.height=53.98*px+'px';tip.textContent='Допрете картата хоризонтално – по дългата страна.'}
      else{cb.style.width=53.98*px+'px';cb.style.height=85.6*px+'px';tip.textContent='Допрете картата изправена – важна е ширината (късата страна).'}}
  }
  function setObj(o){obj=o;document.getElementById('o-card').setAttribute('aria-pressed',o==='card');document.getElementById('o-coin').setAttribute('aria-pressed',o==='coin');upd()}
  sl.addEventListener('input',upd);
  on('o-card',function(){setObj('card')});on('o-coin',function(){setObj('coin')});
  on('mn',function(){sl.value=(+sl.value-0.03).toFixed(2);upd()});on('pl',function(){sl.value=(+sl.value+0.03).toFixed(2);upd()});
  on('ok',function(){S.pxmm=px;S.calibrated=true;store('io_pxmm',px);next()});
  on('skip',function(){if(!S.calibrated){S.pxmm=mob?6.1:3.78}next()});
  if(85.6*px>wrap.clientWidth-4)setObj('coin');else upd();
}

/* ---------- DISTANCE ---------- */
function dist(){
  var o=[[1000,'1 метър','Протегната ръка плюс малко – удобно за компютър'],[2000,'2 метра','По-точно. Отговаряйте с клавишите със стрелки или с помощник'],[3000,'3 метра','Най-точно за зрение надалеч']];
  var mob=/Mobi|Android|iPhone/i.test(navigator.userAgent);
  h(prog()+'<h2>На какво разстояние ще сте от екрана?</h2>'+(mob?'<div class="notice warn" style="margin:8px 0 14px"><p><b>На телефон:</b> за зрение надалеч е по-добре да направите теста на компютър или да подпрете телефона и да помолите някого да натиска стрелките вместо вас.</p></div>':'')+'<p class="hint">Колкото по-далече, толкова по-добре се проверява зрението надалеч. Седнете и не се навеждайте по време на теста. Ако носите очила за далече, сложете ги.</p><div class="list">'+
  o.map(function(x){return '<button class="choice" type="button" data-v="'+x[0]+'"><b style="font-size:17px">'+x[1]+'</b><small>'+x[2]+'</small></button>'}).join('')+'</div>');
  app.querySelectorAll('[data-v]').forEach(function(b){b.addEventListener('click',function(){S.dist=+b.dataset.v;next()})});
}

/* ---------- LANDOLT C ---------- */
var DIRS={0:'right',90:'down',180:'left',270:'up'};
function cSVG(px,rot,color){
  return '<svg width="'+px+'" height="'+px+'" viewBox="0 0 5 5" role="img" aria-label="Пръстен с отвор" style="display:block"><g transform="rotate('+rot+' 2.5 2.5)"><circle cx="2.5" cy="2.5" r="2" fill="none" stroke="'+(color||'#000')+'" stroke-width="1"/><rect x="2.9" y="2" width="2.2" height="1" fill="#FFFFFF"/></g></svg>';
}
function mmFor(V){return 5*S.dist*Math.tan((1/V)*Math.PI/10800)} /* diameter of C in mm */
function arrows(){
  var a=function(r,lab,pos){return '<button class="arrow" type="button" data-d="'+r+'" aria-label="'+lab+'" style="grid-area:'+pos+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="transform:rotate('+r+'deg)"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>'};
  return '<div class="pad">'+a(270,'Отворът е нагоре','1/2')+a(180,'Отворът е наляво','2/1')+'<button class="arrow" type="button" data-d="x" style="grid-area:2/2;font-size:12px;font-weight:600" aria-label="Не виждам">Не<br>виждам</button>'+a(0,'Отворът е надясно','2/3')+a(90,'Отворът е надолу','3/2')+'</div>';
}
function bindArrows(cb){
  app.querySelectorAll('[data-d]').forEach(function(b){b.addEventListener('click',function(){cb(b.dataset.d)})});
  var kd=function(e){var m={ArrowRight:'0',ArrowDown:'90',ArrowLeft:'180',ArrowUp:'270'};if(m[e.key]){e.preventDefault();document.removeEventListener('keydown',kd);cb(m[e.key])}};
  document.addEventListener('keydown',kd);
  return function(){document.removeEventListener('keydown',kd)};
}
var VA=[0.1,0.16,0.2,0.25,0.32,0.4,0.5,0.63,0.8,1.0,1.25];
function va(e){
  var lv=2,trial=0,good=0,best=null,tries=0,off=null;
  var maxIdx=VA.length-1; while(maxIdx>0&&mmFor(VA[maxIdx])*S.pxmm<6) maxIdx--;
  function intro(){
    h(prog()+'<h2>Зрителна острота – '+EYE[e]+' око</h2>'+eyeBox(e)+'<p class="hint">Ще виждате пръстен с отвор. Посочете накъде е отворът – нагоре, надолу, наляво или надясно. Ако не сте сигурни, опитайте да познаете. Знаците ще стават все по-малки.</p><button class="btn primary" id="go" type="button">Започни</button>');
    on('go',show);
  }
  function show(){
    if(off)off();
    var rot=[0,90,180,270][Math.floor(Math.random()*4)];
    var px=mmFor(VA[lv])*S.pxmm;
    h(prog()+'<h2 class="sr-only" style="position:absolute;left:-9999px">Острота – '+EYE[e]+' око</h2><p class="note">'+EYE[e].charAt(0).toUpperCase()+EYE[e].slice(1)+' око · разстояние '+(S.dist/1000)+' м</p><div class="stage" style="min-height:'+Math.max(220,px+40)+'px">'+cSVG(px.toFixed(2),rot)+'</div>'+arrows());
    off=bindArrows(function(d){
      off();tries++;
      if(d!=='x'&&+d===rot) good++;
      trial++;
      if(good>=2||trial-good>=2){
        var passed=good>=2;trial=0;good=0;
        if(passed){best=lv; if(lv>=maxIdx) return done(); lv++; }
        else{ if(best===null&&lv>0){lv--; if(lv===0&&tries>14) return done();} else return done(); }
        if(tries>40) return done();
      }
      show();
    });
  }
  function done(){
    if(off)off();
    S.r['va'+e]={v:best===null?null:VA[best],capped:best===maxIdx&&maxIdx<VA.length-1};
    next();
  }
  intro();
}

/* ---------- CONTRAST ---------- */
function grayFor(c){var L=1-c;var s=L<=0.0031308?12.92*L:1.055*Math.pow(L,1/2.4)-0.055;var v=Math.round(s*255);v=Math.min(v,254);var hx=v.toString(16).padStart(2,'0');return '#'+hx+hx+hx}
var CS=[0.5,0.25,0.125,0.063,0.032,0.016,0.008];
function cs(){
  var lv=0,trial=0,good=0,best=null,off=null;
  var px=Math.max(mmFor(0.16)*S.pxmm,40);
  h(prog()+'<h2>Контрастна чувствителност</h2>'+eyeBox('B')+'<p class="hint">Пръстенът е с постоянен размер, но става все по-блед. Посочете отвора, докато вече не го различавате. Яркостта на екрана нека е на максимум.</p><button class="btn primary" id="go" type="button">Започни</button>');
  on('go',show);
  function show(){
    var rot=[0,90,180,270][Math.floor(Math.random()*4)];
    h(prog()+'<p class="note">Контраст · двете очи</p><div class="stage" style="min-height:'+(px+60)+'px">'+cSVG(px.toFixed(1),rot,grayFor(CS[lv]))+'</div>'+arrows());
    off=bindArrows(function(d){
      off();if(d!=='x'&&+d===rot)good++;trial++;
      if(good>=2||trial-good>=2){var p=good>=2;trial=0;good=0;if(p){best=lv;if(lv>=CS.length-1)return fin();lv++}else return fin()}
      show();
    });
  }
  function fin(){S.r.cs=best===null?null:CS[best];next()}
}

/* ---------- ASTIGMATISM ---------- */
function fan(){
  var g='',cx=150,cy=150;
  for(var i=0;i<12;i++){var a=i*15*Math.PI/180;for(var k=-1;k<=1;k++){var o=k*5,dx=Math.cos(a),dy=Math.sin(a),nx=-dy*o,ny=dx*o;
    g+='<line x1="'+(cx+dx*30+nx).toFixed(1)+'" y1="'+(cy-dy*30-ny).toFixed(1)+'" x2="'+(cx+dx*140+nx).toFixed(1)+'" y2="'+(cy-dy*140-ny).toFixed(1)+'"/>';
    g+='<line x1="'+(cx-dx*30+nx).toFixed(1)+'" y1="'+(cy+dy*30-ny).toFixed(1)+'" x2="'+(cx-dx*140+nx).toFixed(1)+'" y2="'+(cy+dy*140-ny).toFixed(1)+'"/>';}}
  var lab='';for(var j=1;j<=12;j++){var b=(90-j*30)*Math.PI/180;lab+='<text x="'+(cx+Math.cos(b)*150).toFixed(1)+'" y="'+(cy-Math.sin(b)*150+5).toFixed(1)+'">'+j+'</text>'}
  return '<svg viewBox="-12 -12 324 324" width="300" height="300" role="img" aria-label="Лъчево колело за астигматизъм" style="max-width:100%;height:auto"><g stroke="#000" stroke-width="2.2">'+g+'</g><circle cx="150" cy="150" r="5" fill="#000"/><g font-family="Commissioner,sans-serif" font-size="15" text-anchor="middle" fill="#4A5E6E">'+lab+'</g></svg>';
}
function ast(e){
  h(prog()+'<h2>Астигматизъм – '+EYE[e]+' око</h2>'+eyeBox(e)+'<p class="hint">От разстояние '+(S.dist/1000)+' м гледайте точката в центъра. Изглеждат ли всички линии еднакво черни и ясни?</p><div class="stage">'+fan()+'</div>'+
  '<div class="list"><button class="choice" type="button" data-v="0"><b style="font-size:17px">Да, всички са еднакви</b></button><button class="choice" type="button" data-v="1"><b style="font-size:17px">Не, някои са по-тъмни или по-ясни</b></button></div>');
  app.querySelectorAll('[data-v]').forEach(function(b){b.addEventListener('click',function(){S.r['ast'+e]=b.dataset.v==='1';next()})});
}

/* ---------- COLOR ---------- */
var FIG=['#D9824D','#E39A5B','#CF7449','#E8A66C','#D88E5F'],BGC=['#97AC60','#8AA058','#A5B76D','#9CA963','#B0BA70'];
var CFIG=['#3E5BA9','#4F6BB6','#3A55A0'],CBGC=['#C9B79A','#D3C2A5','#BFAE90'];
function plate(canvas,num,fig,bgc){
  var dpr=window.devicePixelRatio||1,W=300;canvas.width=W*dpr;canvas.height=W*dpr;canvas.style.width='min(300px,100%)';
  var c=canvas.getContext('2d');c.scale(dpr,dpr);
  var m=document.createElement('canvas');m.width=W;m.height=W;var mc=m.getContext('2d');
  mc.fillStyle='#000';mc.font='900 '+(num.length>1?175:215)+'px Arial Black,Arial,sans-serif';mc.textAlign='center';mc.textBaseline='middle';mc.lineWidth=num.length>1?6:9;mc.lineJoin='round';mc.strokeStyle='#000';mc.strokeText(num,W/2,W/2+8);mc.fillText(num,W/2,W/2+8);
  var md=mc.getImageData(0,0,W,W).data;
  var dots=[],cell=16,grid={};
  function ok(x,y,r){var gx=Math.floor(x/cell),gy=Math.floor(y/cell);for(var i=gx-1;i<=gx+1;i++)for(var j=gy-1;j<=gy+1;j++){var l=grid[i+','+j];if(l)for(var k=0;k<l.length;k++){var d=l[k];var dx=d[0]-x,dy=d[1]-y;if(dx*dx+dy*dy<(d[2]+r+1)*(d[2]+r+1))return false}}return true}
  var radii=[5.2,4.4,3.7,3.1,2.6,2.1,1.7];
  radii.forEach(function(R){for(var t=0;t<4200;t++){var a=Math.random()*Math.PI*2,rr=Math.sqrt(Math.random())*(142-R);var x=W/2+Math.cos(a)*rr,y=W/2+Math.sin(a)*rr;var r=R*(0.85+Math.random()*0.3);if(ok(x,y,r)){var d=[x,y,r];dots.push(d);var key=Math.floor(x/cell)+','+Math.floor(y/cell);(grid[key]=grid[key]||[]).push(d)}}});
  c.fillStyle='#FFFFFF';c.fillRect(0,0,W,W);
  dots.forEach(function(d){var inF=md[(Math.round(d[1])*W+Math.round(d[0]))*4+3]>100;var pal=inF?fig:bgc;c.fillStyle=pal[Math.floor(Math.random()*pal.length)];c.beginPath();c.arc(d[0],d[1],d[2],0,Math.PI*2);c.fill()});
}
function col(){
  var pool=shuffle(['12','74','45','97','5','3','7','2','4','42']);
  var plates=[{n:pool[0],ctrl:true},{n:pool[1]},{n:pool[2]},{n:pool[3]}],idx=0,res={ctrl:false,rg:0};
  h(prog()+'<h2>Цветно зрение</h2>'+eyeBox('B')+'<p class="hint">Ще видите 4 кръга от цветни точки. Посочете числото, което виждате в кръга. Ако не виждате число, изберете „Не виждам“. Можете да гледате отблизо.</p><button class="btn primary" id="go" type="button">Започни</button>');
  on('go',show);
  function show(){
    var p=plates[idx];var opts=[p.n];var all=pool.slice(4);while(opts.length<3){var x=all.shift();if(opts.indexOf(x)<0)opts.push(x)}shuffle(opts);
    h(prog()+'<p class="note">Таблица '+(idx+1)+' от 4</p><div class="stage"><canvas id="pl" role="img" aria-label="Точкова таблица"></canvas></div><div class="row" role="group" aria-label="Отговор">'+
    opts.map(function(o){return '<button class="btn" type="button" data-v="'+o+'" style="min-width:76px">'+o+'</button>'}).join('')+'<button class="btn" type="button" data-v="x">Не виждам</button></div>');
    plate(document.getElementById('pl'),p.n,p.ctrl?CFIG:FIG,p.ctrl?CBGC:BGC);
    app.querySelectorAll('[data-v]').forEach(function(b){b.addEventListener('click',function(){
      var right=b.dataset.v===p.n; if(p.ctrl)res.ctrl=right; else if(right)res.rg++;
      idx++; if(idx<plates.length)show(); else {S.r.col=res;next()}
    })});
  }
}

/* ---------- NEAR ---------- */
var TXT=['Добрите очила правят деня по-лек.','Четенето отблизо се променя с годините.','Ясното зрение е важно при шофиране и работа.','Точното измерване е половината от успеха.','Лещите се избират според начина на живот.'];
var NS=[12,10,8,6,5];
function near(){
  h(prog()+'<h2>Четене отблизо</h2>'+eyeBox('B')+'<p class="hint">Дръжте телефона или се доближете до екрана на <b>40 см</b> (около една педя и половина). Ако носите очила за четене, сложете ги. Изберете <b>най-малкия ред</b>, който четете без усилие.</p><div class="list">'+
  NS.map(function(n,i){return '<button class="readrow" type="button" data-v="'+n+'" style="font-size:'+(n*0.3528*S.pxmm).toFixed(2)+'px"><em>Ред '+(i+1)+'</em>'+TXT[i]+'</button>'}).join('')+
  '</div><button class="btn" type="button" data-v="0">Не чета удобно нито един ред</button>');
  app.querySelectorAll('[data-v]').forEach(function(b){b.addEventListener('click',function(){S.r.near=+b.dataset.v;next()})});
}

/* ---------- AMSLER ---------- */
function amsGrid(){var g='';for(var i=0;i<=20;i++){g+='<line x1="'+i*14+'" y1="0" x2="'+i*14+'" y2="280"/><line x1="0" y1="'+i*14+'" x2="280" y2="'+i*14+'"/>'}
  return '<svg viewBox="-2 -2 284 284" width="280" height="280" role="img" aria-label="Решетка на Амслер" style="max-width:100%;height:auto;background:#fff"><g stroke="#000" stroke-width="1">'+g+'</g><circle cx="140" cy="140" r="4" fill="#000"/></svg>'}
function ams(e){
  h(prog()+'<h2>Решетка на Амслер – '+EYE[e]+' око</h2>'+eyeBox(e)+'<p class="hint">На около 40 см, с очилата за четене, гледайте само черната точка в центъра. Без да местите погледа: изглеждат ли всички линии прави, а квадратите еднакви и цели?</p><div class="stage">'+amsGrid()+'</div>'+
  '<div class="list"><button class="choice" type="button" data-v="0"><b style="font-size:17px">Да, всичко е право и цяло</b></button><button class="choice" type="button" data-v="1"><b style="font-size:17px">Не – има изкривени, размазани или липсващи участъци</b></button></div>');
  app.querySelectorAll('[data-v]').forEach(function(b){b.addEventListener('click',function(){S.r['ams'+e]=b.dataset.v==='1';next()})});
}

/* ---------- RESULTS ---------- */
function vaTxt(o){if(!o||o.v===null)return 'под 0,1';return (o.capped?'поне ':'')+String(o.v).replace('.',',')}
function vaSt(o){if(!o||o.v===null||o.v<0.5)return 'alert';if(o.v<0.8)return 'warn';return 'ok'}
function results(){
  var R=S.r,cards=[],alerts=[],recs=[],share=['Тест за зрението iOptics ('+(S.mode==='full'?'пълен':'бърз')+', '+(S.dist/1000)+' м'+(S.calibrated?'':', без калибриране')+'):'];
  var lab={ok:'Добре',warn:'За проверка',alert:'Понижено'};
  ['R','L'].forEach(function(e){var o=R['va'+e],st=vaSt(o);cards.push(['Острота – '+EYE[e]+' око',lab[st]+' · '+vaTxt(o),st]);share.push('Острота '+EYE[e]+' око: '+vaTxt(o))});
  var sR=vaSt(R.vaR),sL=vaSt(R.vaL);
  if(sR!=='ok'||sL!=='ok')recs.push('Зрението надалеч е под нормата поне на едното око. Това често се коригира с очила – струва си да го проверим с Visionix VX120+.');
  if(R.vaR&&R.vaL&&R.vaR.v&&R.vaL.v&&Math.abs(VA.indexOf(R.vaR.v)-VA.indexOf(R.vaL.v))>=2)recs.push('Има разлика между двете очи. Препоръчваме проверка, дори ако не усещате затруднение.');
  if(S.mode==='full'){
    var c=R.cs,cst=c===null||c>=0.125?'alert':(c>=0.063?'warn':'ok');
    cards.push(['Контраст',lab[cst]+' · '+(c===null?'под 50 %':String(Math.round(c*1000)/10).replace('.',',')+' %'),cst]);share.push('Контраст: '+(c===null?'под 50%':Math.round(c*1000)/10+'%'));
    if(cst!=='ok')recs.push('Контрастната чувствителност е понижена. Тя е важна при шофиране вечер и в мъгла. Може да е от нужда от корекция, но понякога е ранен признак на катаракта – VX120+ я проверява.');
    var aR=R.astR,aL=R.astL;
    cards.push(['Астигматизъм',(aR||aL)?'Възможен'+(aR&&aL?' – и двете очи':' – '+(aR?'дясно':'ляво')+' око'):'Не се забелязва',(aR||aL)?'warn':'ok']);share.push('Астигматизъм: '+((aR||aL)?'възможен':'не'));
    if(aR||aL)recs.push('Неравномерните линии подсказват астигматизъм. Той се коригира с правилно изчислени лещи – точната ос и стойност се измерват в оптиката.');
    var co=R.col,cbad=co.rg<2;
    cards.push(['Цветно зрение',!co.ctrl?'Неясен резултат':(cbad?'Възможно отклонение':'Нормално'),!co.ctrl?'warn':(cbad?'info':'ok')]);share.push('Цветове: '+co.rg+'/3');
    if(co.ctrl&&cbad)recs.push('Възможно е затруднение при различаване на червено и зелено. Това не се лекува, но е добре да го знаете – цветовете на екрана също могат да влияят.');
    var n=R.near,nst=n===5||n===6?'ok':(n===8||n===10?'warn':'alert');
    cards.push(['Четене отблизо',n===0?'Затруднено':(nst==='ok'?'Добре':'Затруднено'),nst]);share.push('Четене: '+(n?'N'+n:'нито един ред'));
    if(nst!=='ok'){
      if(S.age==='a40'||S.age==='a55')recs.push('Затрудненото четене след 40-ата година най-често е пресбиопия – естествено намаляване на фокусирането отблизо. Прогресивните очила решават това с един чифт за всички разстояния. <a href="progresivni-ochila.html">Вижте как работим с прогресивни очила →</a>');
      else recs.push('Четенето отблизо е затруднено. При тази възраст причината може да е далекогледство или умора от екрана – препоръчваме измерване.');
    }
    var mR=R.amsR,mL=R.amsL;
    cards.push(['Решетка на Амслер',(mR||mL)?'Има промени':'Нормално',(mR||mL)?'alert':'ok']);share.push('Амслер: '+((mR||mL)?'промени':'норма'));
    if(mR||mL)alerts.push('Изкривените или липсващи участъци в решетката на Амслер могат да са признак на промени в макулата (центъра на ретината). Очилата не решават това – запишете час при офталмолог възможно най-скоро. В iOptics веднъж месечно преглежда офталмолог.');
  }
  if(!recs.length&&!alerts.length)recs.push('Резултатите изглеждат добре. Онлайн тестът обаче не измерва точния диоптър и не открива всичко – препоръчваме цялостен анализ на зрението веднъж годишно, а след 40 г. и проверка на очното налягане.');
  var bad=cards.filter(function(x){return x[2]!=='ok'}).length;
  var title=alerts.length?'Препоръчваме преглед скоро':(bad?'Има какво да проверим':'Зрението ви изглежда добре');
  var stext=share.join('\n');
  h('<p class="eyebrow">Вашият резултат</p><h1>'+title+'</h1><div class="stack">'+
  alerts.map(function(a){return '<div class="notice alert"><h3>Не отлагайте</h3><p>'+a+'</p><p style="margin-top:8px">При внезапна загуба на зрение, светкавици или „завеса“ пред окото потърсете спешна очна помощ още днес.</p></div>'}).join('')+
  '<div class="res">'+cards.map(function(x){return '<div class="rc '+x[2]+'"><h4>'+x[0]+'</h4><p>'+x[1]+'</p></div>'}).join('')+'</div>'+
  (S.calibrated?'':'<p class="note">Екранът не е калибриран, затова стойностите са приблизителни.</p>')+
  '<div class="notice info"><h3>Какво означава</h3><ul class="dots" style="margin:8px 0 0;color:inherit">'+recs.map(function(r){return '<li>'+r+'</li>'}).join('')+'</ul></div>'+
  '<div class="cta"><div><h3 style="margin:0 0 4px">Проверете със сигурност</h3><p>Анализ на зрението с Visionix VX120+ – рефракция, налягане, скрийнинг за глаукома и катаракта. Тел. 0883 330 599</p></div><a class="btn primary" href="'+CAL+'" target="_blank" rel="noopener">Запазете час</a></div>'+
  '<div class="row"><button class="btn" id="viber" type="button">Изпратете резултата по Viber</button><button class="btn" id="copy" type="button">Копирайте резултата</button></div><p class="note" id="cmsg" role="status"></p><p class="note">Не се копира? <a href="#" id="vfwd">Изпратете текста директно през Viber</a> и изберете iOptics от списъка.</p><pre id="rtext" hidden style="white-space:pre-wrap;background:var(--bg);border-radius:12px;padding:12px;font:inherit;font-size:14px;user-select:all"></pre>'+
  (S.mode==='full'?'<div class="notice warn"><h3>Последна стъпка</h3><p>Отговорете на 7 кратки въпроса за начина ви на живот и ще ви препоръчаме вид лещи.</p><a class="btn primary" href="vaprosnik.html" style="margin-top:12px">Към въпросника</a></div>':'<div class="notice warn"><h3>Искате по-пълна картина?</h3><p>Пълният тест проверява и контраст, астигматизъм, цветове, четене и решетка на Амслер.</p><button class="btn primary" id="full" type="button" style="margin-top:12px">Направете пълния тест</button></div>')+
  '<div class="row"><button class="btn" id="again" type="button">Започнете отначало</button></div></div>');
  function syncCopy(){var t=document.createElement('textarea');t.value=stext;t.setAttribute('readonly','');t.style.position='absolute';t.style.left='-9999px';t.style.fontSize='16px';document.body.appendChild(t);
    t.focus();t.select();t.setSelectionRange(0,stext.length);var ok=false;try{ok=document.execCommand('copy')}catch(e){}t.remove();return ok}
  function copyAll(){var ok=syncCopy();var p=(navigator.clipboard&&navigator.clipboard.writeText)?navigator.clipboard.writeText(stext).then(function(){return true},function(){return ok}):Promise.resolve(ok);return p}
  var msg=function(t){document.getElementById('cmsg').innerHTML=t};
  on('copy',function(){copyAll().then(function(ok){msg(ok?'Резултатът е копиран.':'Не успяхме да копираме автоматично – маркирайте текста по-долу и го копирайте.');if(!ok)showText()})});
  on('viber',function(){copyAll().then(function(ok){
    msg(ok?'Резултатът е копиран. В чата с iOptics задръжте пръст в полето за писане → „Постави“ → „Изпрати“.':'Копирайте текста по-долу и го поставете в чата.');
    if(!ok)showText();
    setTimeout(function(){window.location.href='viber://chat?number='+encodeURIComponent(PHONE)},350);
  })});
  on('vfwd',function(e){e.preventDefault();window.location.href='viber://forward?text='+encodeURIComponent(stext)});
  function showText(){var b=document.getElementById('rtext');b.hidden=false;b.textContent=stext}
  on('again',start);
  on('full',function(){S.mode='full';S.r={};setup()});
}
start();
})();
</script>
