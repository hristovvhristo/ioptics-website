plugins { id 'com.android.application' }

// Вграждаме кабинета от сайта (../kabinet) – един и същ код за сайта и за приложението.
def wwwDir = layout.buildDirectory.dir("generated/www")
def copyWww = tasks.register("copyKabinet", Sync) {
    into wwwDir
    from("$rootDir/../kabinet") {
        into "www/kabinet"
        include "*.html", "*.js", "*.css"
        filter { String line ->
            line.replace("https://www.gstatic.com/firebasejs/10.12.2/", "vendor/")
        }
    }
    from("$rootDir/vendor/firebase") { into "www/kabinet/vendor"; include "*.js" }
    from("$rootDir/../images") { into "www/images"; include "logo.png" }
}

android {
    namespace 'bg.ioptics.kabinet'
    compileSdk 35

    defaultConfig {
        applicationId 'bg.ioptics.kabinet'
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName '1.1'
    }

    // Ключът за подписване НЕ е в хранилището: kabinet.keystore и keystore.properties
    // се пазят отделно и се слагат в android-tv/ преди сглобяване.
    def ksFile = rootProject.file("keystore.properties")
    signingConfigs {
        if (ksFile.exists()) {
            def ks = new Properties(); ksFile.withInputStream { ks.load(it) }
            shared {
                storeFile rootProject.file(ks['storeFile'])
                storePassword ks['storePassword']
                keyAlias ks['keyAlias']
                keyPassword ks['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig ksFile.exists() ? signingConfigs.shared : signingConfigs.debug
        }
    }

    buildFeatures { buildConfig true }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets { main { assets.srcDirs += wwwDir } }
}

tasks.named("preBuild") { dependsOn copyWww }
