<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0f172a">
<title>Стокови разписки</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  :root{--bg:#0f172a;--card:#1e293b;--tx:#f8fafc;--mut:#94a3b8;--ok:#22c55e;--warn:#f59e0b;--err:#ef4444;--acc:#38bdf8}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom))}
  main{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
  h1{font-size:20px;margin:0}
  header{display:flex;justify-content:space-between;align-items:center}
  button{font:inherit;border:0;border-radius:14px;padding:14px 18px;cursor:pointer;color:var(--tx);background:var(--card)}
  button.primary{background:var(--ok);color:#052e16;font-weight:700;font-size:20px;padding:26px 18px}
  button.ghost{background:transparent;color:var(--mut);padding:8px 10px}
  .card{background:var(--card);border-radius:16px;padding:16px}
  .row{display:flex;gap:10px}.row>*{flex:1}
  #preview{width:100%;border-radius:12px;max-height:55vh;object-fit:contain;background:#000}
  input[type=text]{width:100%;padding:12px;border-radius:10px;border:1px solid #334155;background:#0f172a;color:var(--tx);font:inherit}
  label{display:block;color:var(--mut);font-size:14px;margin:10px 0 6px}
  ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
  li{display:flex;justify-content:space-between;gap:10px;font-size:14px}
  .s-ok{color:var(--ok)}.s-wait{color:var(--warn)}.s-err{color:var(--err)}
  .mut{color:var(--mut);font-size:14px}
  #status{min-height:22px;font-size:14px;color:var(--mut)}
  .hidden{display:none!important}
</style>
</head>
<body>
<main>
  <header>
    <h1>📄 Стокови разписки</h1>
    <button class="ghost" id="btnSettings" aria-label="Настройки">⚙️</button>
  </header>

  <section id="viewMain" class="card">
    <input id="file" type="file" accept="image/*" capture="environment" class="hidden">
    <button class="primary" id="btnShoot" style="width:100%">📷 Снимай разписка</button>
    <p class="mut" style="margin:12px 0 0">Снимката се качва в Google Drive → <b>Стокови разписки / ГГГГ-ММ</b>. Ако е на няколко листа, снимай ги един след друг.</p>
  </section>

  <section id="viewPreview" class="card hidden">
    <img id="preview" alt="Преглед">
    <p class="mut">Чете ли се ясно? Ако не – преснимай.</p>
    <div class="row">
      <button id="btnRetake">Преснимай</button>
      <button class="primary" id="btnUpload" style="padding:14px 18px;font-size:18px">Качи</button>
    </div>
  </section>

  <div id="status" role="status"></div>

  <section class="card" id="cardQueue">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <b>Последни</b>
      <button class="ghost" id="btnRetry">Опитай пак</button>
    </div>
    <ul id="list"></ul>
    <p class="mut hidden" id="emptyList" style="margin:0">Още няма снимки.</p>
  </section>

  <section id="viewSettings" class="card hidden">
    <b>Настройки</b>
    <label for="clientId">Google OAuth Client ID</label>
    <input type="text" id="clientId" placeholder="123456789-abc.apps.googleusercontent.com" autocomplete="off" autocapitalize="off">
    <p class="mut">Създава се веднъж в Google Cloud Console (вижте README.md в тази папка).</p>
    <div class="row">
      <button id="btnSaveSettings" class="primary" style="padding:14px;font-size:16px">Запази</button>
      <button id="btnSignOut">Излез</button>
    </div>
  </section>
</main>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
'use strict';
const ROOT_FOLDER = 'Стокови разписки';
const SCOPE = 'https://www.googleapis.com/auth/drive.file';
const MAX_SIDE = 2200, JPEG_Q = 0.85;
const $ = id => document.getElementById(id);
const ls = {
  get(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};

/* ---------- IndexedDB опашка (оцелява офлайн / затваряне на приложението) ---------- */
const DB = {
  _db: null,
  open(){
    return this._db ||= new Promise((res, rej) => {
      const r = indexedDB.open('razpiski', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('q', { keyPath: 'id' });
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
  },
  async tx(mode, fn){
    const db = await this.open();
    return new Promise((res, rej) => {
      const t = db.transaction('q', mode); const out = fn(t.objectStore('q'));
      t.oncomplete = () => res(out.result); t.onerror = () => rej(t.error);
    });
  },
  put(item){ return this.tx('readwrite', s => s.put(item)); },
  del(id){ return this.tx('readwrite', s => s.delete(id)); },
  all(){ return this.tx('readonly', s => s.getAll()); }
};

/* ---------- Google вход ---------- */
let tokenClient = null, accessToken = null, tokenExp = 0;
function getToken(interactive){
  return new Promise((resolve, reject) => {
    if (accessToken && Date.now() < tokenExp - 60000) return resolve(accessToken);
    const cid = ls.get('clientId', '');
    if (!cid) return reject(new Error('Липсва Client ID – отвори ⚙️ Настройки.'));
    if (!window.google || !google.accounts) return reject(new Error('Google вход не е зареден (няма интернет?).'));
    if (!tokenClient || tokenClient._cid !== cid){
      tokenClient = google.accounts.oauth2.initTokenClient({ client_id: cid, scope: SCOPE, callback: () => {} });
      tokenClient._cid = cid;
    }
    tokenClient.callback = r => {
      if (r.error) return reject(new Error('Входът е неуспешен: ' + r.error));
      accessToken = r.access_token; tokenExp = Date.now() + (r.expires_in || 3600) * 1000;
      ls.set('signedIn', true);
      resolve(accessToken);
    };
    tokenClient.error_callback = e => reject(new Error('Входът е прекъснат (' + (e.type || 'грешка') + ').'));
    tokenClient.requestAccessToken({ prompt: interactive ? (ls.get('signedIn', false) ? '' : 'consent') : '' });
  });
}

/* ---------- Drive ---------- */
async function drive(path, opts = {}, token){
  const r = await fetch('https://www.googleapis.com' + path, { ...opts, headers: { Authorization: 'Bearer ' + token, ...(opts.headers || {}) } });
  if (!r.ok){
    if (r.status === 401) accessToken = null;
    throw new Error('Drive ' + r.status + ': ' + (await r.text()).slice(0, 200));
  }
  return r.json();
}
async function ensureFolder(name, parent, token){
  const key = 'folder:' + (parent || 'root') + ':' + name;
  const cached = ls.get(key, null);
  if (cached){
    try { const f = await drive('/drive/v3/files/' + cached + '?fields=id,trashed', {}, token); if (!f.trashed) return cached; } catch {}
  }
  const q = `name='${name.replace(/'/g, "\\'")}' and mimeType='application/vnd.google-apps.folder' and trashed=false` + (parent ? ` and '${parent}' in parents` : " and 'root' in parents");
  const found = await drive('/drive/v3/files?fields=files(id)&q=' + encodeURIComponent(q), {}, token);
  let id = found.files && found.files[0] && found.files[0].id;
  if (!id){
    const meta = { name, mimeType: 'application/vnd.google-apps.folder', ...(parent ? { parents: [parent] } : {}) };
    id = (await drive('/drive/v3/files?fields=id', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(meta) }, token)).id;
  }
  ls.set(key, id);
  return id;
}
async function uploadItem(item, token){
  const root = await ensureFolder(ROOT_FOLDER, null, token);
  const month = await ensureFolder(item.month, root, token);
  const meta = { name: item.name, parents: [month], description: 'Стокова разписка, заснета ' + item.takenAt };
  const form = new FormData();
  form.append('metadata', new Blob([JSON.stringify(meta)], { type: 'application/json' }));
  form.append('file', item.blob, item.name);
  return drive('/upload/drive/v3/files?uploadType=multipart&fields=id,webViewLink', { method: 'POST', body: form }, token);
}

/* ---------- Снимки ---------- */
const pad = n => String(n).padStart(2, '0');
function stamp(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`; }
async function compress(file){
  const bmp = await createImageBitmap(file, { imageOrientation: 'from-image' }).catch(() => null);
  if (!bmp) return file;
  const k = Math.min(1, MAX_SIDE / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas'); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  return new Promise(res => c.toBlob(b => res(b || file), 'image/jpeg', JPEG_Q));
}

let pending = null; // { blob, url }
function setStatus(t, cls){ const s = $('status'); s.textContent = t || ''; s.className = cls || ''; }
function show(view){ for (const v of ['viewMain','viewPreview','viewSettings']) $(v).classList.toggle('hidden', v !== view); }

$('btnShoot').onclick = () => $('file').click();
$('file').onchange = async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  setStatus('Обработвам снимката…');
  const blob = await compress(f);
  if (pending) URL.revokeObjectURL(pending.url);
  pending = { blob, url: URL.createObjectURL(blob) };
  $('preview').src = pending.url; show('viewPreview'); setStatus('');
};
$('btnRetake').onclick = () => { if (pending) URL.revokeObjectURL(pending.url); pending = null; show('viewMain'); $('file').click(); };
$('btnUpload').onclick = async () => {
  if (!pending) return;
  const d = new Date(), id = Date.now() + '-' + Math.random().toString(36).slice(2, 6);
  const item = { id, name: stamp(d) + '.jpg', month: `${d.getFullYear()}-${pad(d.getMonth()+1)}`, takenAt: d.toISOString(), blob: pending.blob };
  URL.revokeObjectURL(pending.url); pending = null;
  await DB.put(item);
  show('viewMain'); renderList(); flush(true);
};

/* ---------- Изпращане на опашката ---------- */
let flushing = false;
async function flush(interactive){
  if (flushing) return; flushing = true;
  try {
    const items = (await DB.all()).sort((a, b) => a.id.localeCompare(b.id));
    if (!items.length) return;
    if (!navigator.onLine){ setStatus('Няма интернет – снимките са запазени и ще се качат по-късно.', 's-wait'); return; }
    let token;
    try { token = await getToken(interactive); }
    catch (e){ setStatus(e.message + (interactive ? '' : ' Натисни „Опитай пак“.'), 's-err'); return; }
    let done = 0;
    for (const it of items){
      setStatus(`Качвам ${done + 1} от ${items.length}…`);
      try {
        const r = await uploadItem(it, token);
        await DB.del(it.id); done++;
        const log = ls.get('log', []); log.unshift({ name: it.name, month: it.month, link: r.webViewLink || '' }); ls.set('log', log.slice(0, 15));
      } catch (e){ setStatus('Грешка при качване: ' + e.message, 's-err'); break; }
    }
    if (done === items.length) setStatus(`✓ Качени: ${done}`, 's-ok');
  } finally { flushing = false; renderList(); }
}
$('btnRetry').onclick = () => flush(true);
window.addEventListener('online', () => flush(false));

async function renderList(){
  const ul = $('list'); ul.textContent = '';
  const q = await DB.all().catch(() => []);
  const add = (name, txt, cls, href) => {
    const li = document.createElement('li');
    const a = document.createElement(href ? 'a' : 'span'); a.textContent = name; if (href){ a.href = href; a.target = '_blank'; a.rel = 'noopener'; a.style.color = 'var(--acc)'; }
    const s = document.createElement('span'); s.textContent = txt; s.className = cls;
    li.append(a, s); ul.append(li);
  };
  q.sort((a, b) => b.id.localeCompare(a.id)).forEach(i => add(i.name, 'чака', 's-wait'));
  ls.get('log', []).forEach(i => add(i.name, '✓', 's-ok', i.link));
  $('emptyList').classList.toggle('hidden', ul.children.length > 0);
  $('btnRetry').classList.toggle('hidden', q.length === 0);
}

/* ---------- Настройки ---------- */
$('btnSettings').onclick = () => { $('clientId').value = ls.get('clientId', ''); show($('viewSettings').classList.contains('hidden') ? 'viewSettings' : 'viewMain'); };
$('btnSaveSettings').onclick = () => { ls.set('clientId', $('clientId').value.trim()); ls.set('signedIn', false); accessToken = null; show('viewMain'); setStatus('Запазено.', 's-ok'); flush(false); };
$('btnSignOut').onclick = () => {
  if (accessToken && window.google) google.accounts.oauth2.revoke(accessToken, () => {});
  accessToken = null; ls.set('signedIn', false); show('viewMain'); setStatus('Излязохте от Google.');
};

/* ---------- Старт ---------- */
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
if (!ls.get('clientId', '')){ show('viewSettings'); setStatus('Първо въведи Google Client ID.'); }
renderList();
window.addEventListener('load', () => setTimeout(() => flush(false), 800));
</script>
</body>
</html>
